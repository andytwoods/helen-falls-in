<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Helen Falls In</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* the whole screen is a button — no flash */
      -webkit-touch-callout: none;
    }
    html, body {
      height: 100%;
      background: #1c2431;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: ui-monospace, Menlo, monospace;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      height: 100%;
      height: 100dvh; /* track the real visible height as mobile URL bars collapse */
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #hud {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top));
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
      color: #fff;
      font-size: 14px;
      text-shadow: 1px 1px 0 #000;
      pointer-events: none;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 45, 80, 0.75);
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      pointer-events: none;
      text-shadow: 1px 1px 0 #000;
    }
    #overlay.show { display: flex; }
    #panel-toggle {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom));
      right: 10px;
      z-index: 3;
      background: #33415c;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 16px;
      touch-action: none;
    }
    #panel {
      position: fixed;
      top: 0; right: 0;
      height: 100%;
      width: 270px;
      max-width: 85vw;
      background: rgba(15, 20, 30, 0.94);
      color: #dde;
      padding: 12px;
      padding-top: calc(12px + env(safe-area-inset-top));
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.15s ease-out;
      z-index: 2;
      touch-action: pan-y;
      font-size: 11px;
    }
    #panel.open { transform: translateX(0); }
    .slider-row { display: block; margin-bottom: 8px; }
    .slider-row span { display: inline-block; }
    .slider-value { float: right; color: #9fc7ff; }
    .slider-row input[type='range'] { width: 100%; }
    .panel-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .panel-buttons button {
      background: #33415c; color: #fff; border: none; border-radius: 4px;
      padding: 8px; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <span id="hud-time">0.0s</span>
    <span id="hud-best">best 0.0s</span>
  </div>
  <div id="overlay"><div id="overlay-text"></div></div>
  <button id="panel-toggle">⚙</button>
  <div id="panel"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
